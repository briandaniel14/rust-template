# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", language = "system", entry = "cargo fmt --", types = [
        "rust",
    ], pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", language = "system", entry = "cargo clippy --fix --all-targets --allow-dirty -- -D warnings", types = [
        "rust",
    ], pass_filenames = false },
]
